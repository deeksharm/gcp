name: GCP Keyless Auth Demo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth-to-gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug repo context
        run: echo "github.repository = ${{ github.repository }}"

      - id: auth
        name: Authenticate to Google Cloud (no key file!)
        uses: google-github-actions/auth@v3
        with:
          project_id: host-team1-octave
          workload_identity_provider: projects/888796133932/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@host-team1-octave.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify keyless authentication
        run: |
          echo "Authenticated as:"
          gcloud auth list --format="value(account)"
          echo "Project details:"
          gcloud projects describe host-team1-octave --format="value(name,projectId)"
